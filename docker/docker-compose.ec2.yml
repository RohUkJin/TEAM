services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fullstack_study_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # EC2 호스트의 Let’s Encrypt 인증서만 읽기 전용으로 제공한다.
      - /home/ec2-user/letsencrypt/etc:/etc/letsencrypt:ro
