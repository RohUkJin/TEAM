server {
    listen 80;
    server_name weteam.cloud www.weteam.cloud;

    # 모든 평문 요청을 HTTPS로 통일한다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name weteam.cloud www.weteam.cloud;

    ssl_certificate /etc/letsencrypt/live/weteam.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weteam.cloud/privkey.pem;

    # API와 Swagger는 백엔드로만 전달한다. 브라우저에 백엔드 포트를 공개하지 않는다.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
